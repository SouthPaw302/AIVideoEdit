name: Temporary Project-Neutral Content Migration
on:
  push:
    branches: ["main"]
    paths: [".github/workflows/tmp-project-neutral-content-migration.yml"]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Migrate project-neutral system content
        shell: bash
        run: |
          set -euo pipefail
          [ ! -d general/reusable/silver-coin-tools ] || mv general/reusable/silver-coin-tools general/reusable/painterly-motion
          if [ -d general/reusable/silver-coin-docs ]; then mkdir -p general/reusable/painterly-motion/docs; mv general/reusable/silver-coin-docs/* general/reusable/painterly-motion/docs/; rmdir general/reusable/silver-coin-docs; fi
          [ ! -d general/reusable/irish-eyes-tools ] || mv general/reusable/irish-eyes-tools general/reusable/memory-atmosphere
          [ ! -f general/reusable/memory-atmosphere/south_florida_memory_fx.py ] || mv general/reusable/memory-atmosphere/south_florida_memory_fx.py general/reusable/memory-atmosphere/memory_atmosphere_fx.py
          rm -f general/reusable/painterly-motion/video_fx/render_silver_coin_v8_effect_pack.py
          [ ! -f general/reusable/fx_v2/examples/leave-it-by-the-door-core.fx.json ] || mv general/reusable/fx_v2/examples/leave-it-by-the-door-core.fx.json general/reusable/fx_v2/examples/approved-runtime-core.fx.json

          cat > README.md <<'EOF'
          # AIVideoEdit

          Canonical production system for dynamic long-form music films.

          **Start:** read `AGENT_HANDOFF.md`.

          ## Repository law
          - `main` is system-only: doctrine, templates, reusable capabilities, proofs, QC, and system indexes.
          - `main` does not identify, rank, or link to active/completed song productions.
          - Every production lives on its own `song/<slug>` branch.
          - A newly supplied music/audio master for video work (MP3/WAV/FLAC/M4A/AAC/etc.) creates a new `song/<slug>` branch from `main` before production begins, unless the user explicitly says to continue a named existing branch.
          - Song media, story, prompts, shot packages, status, manifests, renders, and QC stay on that production branch.
          - Reusable discoveries return to `main` only after generic extraction, project-neutral naming/path cleanup, proof/QC, and canonical registration.
          - Song/project names must not become reusable effect IDs, folder names, preset names, examples, or discovery paths. Origin may remain only as optional provenance.

          ## System entry points
          - `BIBLE.md`
          - `SYSTEM_INDEX.md`
          - `general/reusable/fx_v2/registry.json`
          - `general/reusable/generative-engine/`
          - `general/reusable/painterly-motion/`
          - `general/reusable/memory-atmosphere/`
          - `general/reusable/depth-parallax-25d/`
          - `general/reusable/tools/`
          EOF

          cat > AGENT_HANDOFF.md <<'EOF'
          # AIVideoEdit — Agent Handoff

          ## Authority
          1. Current explicit user instruction.
          2. If already on a `song/<slug>` branch, that branch's STATUS/HANDOFF/manifests.
          3. `BIBLE.md`, `SYSTEM_INDEX.md`, and `general/reusable/`.
          4. Older chats/summaries/provenance.

          ## Boot
          1. Read `BIBLE.md`.
          2. Read `SYSTEM_INDEX.md`.
          3. Read `general/reusable/fx_v2/registry.json` and `PRECOMPILE_FX_GATE.md`.
          4. Read `general/reusable/PRODUCTION_PIPELINE.md` and `STYLE_CONTRACT.md`.
          5. Inspect connected/runtime tools before new code.
          6. Inspect relevant `general/reusable/` capabilities before inventing substitutes.

          ## Branch trigger
          A newly supplied music/audio master intended for video production creates a fresh `song/<slug>` from `main` before production work begins. Do not search `main` for an active project and do not infer continuation from historical names. Only an explicit user instruction to continue a named existing branch overrides this.

          ## Project-neutral promotion
          Production-created technology is proven on its branch, then generalized: remove production media/paths/constants/story assumptions/names, assign capability IDs/names, create project-neutral proof/QC, promote to `main/general/reusable/`, and register canonically. Origin is provenance, never capability identity.

          ## FX rule
          Resolve callable FX from `general/reusable/fx_v2/registry.json`; run the fail-closed precompile gate; generate and verify the lock immediately before render; inspect the actual exported media. Gate success proves implementation/evidence integrity, not artistic success.

          ## Film rule
          Build real shot packages, not slides. Inspect short proofs before scaling. Use measured song controls when music-reactivity is intended. Protect identity. Never accept invisible effects or command success as QC.

          ## Final QC
          Inspect the actual export for black/damaged frames, freezes, repetition, loop seams, ghosting, missing effects, flicker/boiling, identity drift, source leakage, continuity, framing/aspect, runtime, and audio sync. Record specs/SHA/storage/QC.
          EOF

          cat > SYSTEM_INDEX.md <<'EOF'
          # AIVideoEdit — System Index

          Permanent-system index only. No working-production names or branch links belong here.

          ## Core
          - `README.md` — front door/branch trigger.
          - `AGENT_HANDOFF.md` — boot sequence.
          - `BIBLE.md` — doctrine.
          - `projects/PROJECT_TEMPLATE.md` — branch-local production template.

          ## Reusable capabilities
          - `general/reusable/fx_v2/` — callable FX runtime/registry/proofs/gate.
          - `general/reusable/generative-engine/` — audio analysis, shared controls, reactive/spatial runtime.
          - `general/reusable/painterly-motion/` — living/painterly motion and temporal QC.
          - `general/reusable/memory-atmosphere/` — restoration, shimmer, halation, atmosphere.
          - `general/reusable/depth-parallax-25d/` — depth-assisted 2.5D motion.
          - `general/reusable/tools/` — small generic utilities.
          - `general/reusable/SPATIAL_3DGS_SUPERSPLAT.md` — truthful 3DGS doctrine.

          ## Branch selection
          New supplied audio master -> create new `song/<slug>` from `main`. Explicit request to continue an existing branch -> continue it. Otherwise never guess from historical projects.
          EOF

          cat > BIBLE.md <<'EOF'
          # AIVideoEdit — Bible

          Permanent operating system for dynamic long-form music films.

          ## Branch law
          `main` contains only system doctrine, templates, reusable capabilities, registries, proofs, QC, and indexes. Every production lives on `song/<slug>`. Production media/story/prompts/status/manifests/renders/QC stay there. `main` keeps no active/completed project list.

          A newly supplied music/audio master for video work creates a new `song/<slug>` from `main` before production begins unless the user explicitly identifies an existing branch to continue.

          ## Target
          Make a directed long-form visual film, not a slideshow, generic visualizer, or one clip with weak effects. The film should feel continuously authored through shots, depth, atmosphere, light, motion, environment, composition, transitions, and recurring motifs.

          ## Production order
          Inspect tools/capabilities; analyze song/lyrics; define visual DNA/story; lock storyboard/shot map; build asset/shot library; animate/composite; add music-directed behavior/transitions; assemble only after enough finished shots exist; render full movie; inspect/QC actual export; archive identity/decisions; generalize reusable discoveries.

          ## Shot-package law
          A storyboard is a production map. Selected scenes become genuine branch-local shot packages with the source/layers/depth/masks/generated support/FX/transitions/loops/previews/notes they require. Preview mode means short finished proofs, not premature full assembly.

          ## Reuse/tool-first law
          Before inventing technology, inspect `SYSTEM_INDEX.md`, `general/reusable/fx_v2/registry.json`, `general/reusable/CAPABILITY_LINEAGE.md`, `general/reusable/generative-engine/`, relevant capability folders, and connected/runtime tools. Do not inspect unrelated production branches merely to discover reusable tech; truly reusable tech belongs on `main`.

          ## Capability law
          Canonical shared families include living/painterly motion, atmosphere/environment, light, surface treatment, 2.5D/spatial methods, real radiance-field/3DGS methods when actually used, transitions, loops, audio-reactive controls, procedural plates, and temporal QC.

          ## Technical truthfulness
          2.5D means depth/layer image-space motion. NeRF means an actual trained radiance field. 3DGS means actual Gaussian-splat scene primitives. A Gaussian light/noise field is not 3DGS. A custom reactive field is not projectM/MilkDrop unless that engine is used.

          ## Proof law
          Code existence is not proof. Preserve implementation/backend, parameters, proof render, QC, and keep/revise/reject decision. Effects must be visible in proof and survive export. Callable FX must pass the canonical FX gate/lock.

          ## Music/identity law
          Prefer measured/smoothed music controls for timing, motion density, atmosphere, reflections, light, camera, and transitions. Protect identity-bearing people from morphing, anatomy errors, waxy restoration, bad mattes, and double exposure.

          ## QC law
          A successful render command is not a finished film. Inspect the final export for black/damaged frames, freezes, repeated sections, loop seams, ghosting, invisible effects, flicker/boiling, identity drift, source leakage, continuity, framing/aspect, and full runtime/audio sync.

          ## Promotion law
          A method returns to `main` only after production-specific media, paths, constants, story assumptions, and names are removed. Give it a capability-based stable ID/name, project-neutral path, project-neutral proof/QC, and canonical registry entry. Production origin may remain only as optional provenance; it is never the capability's identity or required discovery path.

          ## Persistence
          GitHub is the persistent brain; large binaries may live in external storage if branch manifests preserve identity/hash/role/recovery location. `main` preserves generalized system material only.

          ## Final principle
          The goal is not “AI pictures behind a song.” The goal is: **the song became a visual world.**
          EOF

          cat > general/reusable/CAPABILITY_LINEAGE.md <<'EOF'
          # Capability Lineage
          Reusable capabilities are identified by what they do, not by the production where they were discovered. Production origin is optional provenance only.

          Families: living/painterly motion; atmosphere/environment; light; surface; spatial/2.5D/radiance-field/3DGS; transitions; audio/reactivity; QC.

          Promotion stages: production experiment -> proof/QC -> generic extraction -> project-neutral naming/path cleanup -> canonical proof -> registry promotion -> ongoing CI/lock verification.

          Callable state lives in `general/reusable/fx_v2/registry.json`.
          EOF

          cat > general/reusable/LESSONS.md <<'EOF'
          # Reusable Lessons
          - A valid still-image timeline is not a dynamic film.
          - Effects must visibly survive export.
          - Inspect short proofs before scaling.
          - Gate success is not artistic acceptance.
          - Protect real-person identity through all processing.
          - Production music-reactivity should use measured controls.
          - Prefer meaningful internal motion over constant whole-frame shake.
          - A capability is not reusable until project-specific media, paths, constants, assumptions, and names are removed.
          - Once generalized, it belongs to AIVideoEdit; origin is provenance, not identity.
          EOF

          cat > general/reusable/README.md <<'EOF'
          # AIVideoEdit Reusable System
          Everything here must be project-neutral and usable without opening an unrelated production branch.

          Canonical directories: `fx_v2/`, `generative-engine/`, `painterly-motion/`, `memory-atmosphere/`, `depth-parallax-25d/`, `tools/`.

          Reusable folders, IDs, presets, examples, and callable symbols are named after capabilities, never productions. Code that still depends on production-specific media/paths/story constants has not completed promotion.
          EOF

          cat > general/reusable/memory-atmosphere/VISIBLE_MEMORY_FX_PRESET.md <<'EOF'
          # Visible Memory / Atmosphere FX Preset
          Project-neutral cinematic-memory treatment combining motivated depth travel, restrained temporal echo/prism separation, halation/bloom, water/reflection displacement, haze/light shafts, and synchronized weather/reflection accents when appropriate.

          QC: visible at normal playback speed; no distracting face duplication; no constant color fringing; motivated distortion/light; preserved highlights; no source obstruction reading as an effect glitch.
          EOF

          cat > projects/PROJECT_TEMPLATE.md <<'EOF'
          # Production Branch Template
          Use only on `song/<slug>`. A newly supplied audio master creates a fresh branch from `main` unless the user explicitly identifies an existing branch to continue.

          Minimum branch-local package: `PROJECT.md`, `STATUS.md`, `HANDOFF.md`, `LYRICS.md` when applicable, `VISUAL_DNA.md`, storyboard/`SHOT_LIST.md`, FX plan/manifest, `ASSET_MANIFEST.json`, `RENDER_HISTORY.md`, `QC.md`, `shot_packages/`.

          Before inventing technology, inspect the project-neutral main system. Reusable discoveries return to `main` only after generic extraction, project-neutral naming/path cleanup, proof/QC, and canonical registration.
          EOF

          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('general/reusable/fx_v2/registry.json'); d=json.loads(p.read_text())
          for e in d.get('effects',{}).values():
              impl=e.get('implementation') or {}; x=impl.get('path')
              if isinstance(x,str): impl['path']=x.replace('general/reusable/silver-coin-tools/','general/reusable/painterly-motion/').replace('general/reusable/irish-eyes-tools/south_florida_memory_fx.py','general/reusable/memory-atmosphere/memory_atmosphere_fx.py')
          sea=d.get('effects',{}).get('FX2-ATM-004')
          if sea:
              sea['status']='unpromoted'; sea['gate_status']='unavailable'; sea['implementation']={'kind':'unpromoted','note':'Production-specific implementation must be generalized and proof-gated before canonical promotion.'}
          p.write_text(json.dumps(d,indent=2)+'\n')
          Path('PROJECT_INDEX.md').unlink(missing_ok=True)
          Path('general/reusable/PROJECT_TECHNIQUE_LINEAGE.md').unlink(missing_ok=True)
          PY

          if grep -R -n -E 'PROJECT_INDEX|PROJECT_TECHNIQUE_LINEAGE|silver-coin-tools|irish-eyes-tools|leave-it-by-the-door-core' README.md AGENT_HANDOFF.md BIBLE.md SYSTEM_INDEX.md projects/PROJECT_TEMPLATE.md general/reusable/README.md general/reusable/fx_v2/registry.json .github/workflows/fx-v2-precompile-gate.yml; then exit 1; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Make main project-neutral and capability-centric'
          git push origin HEAD:main
