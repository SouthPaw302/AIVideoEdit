name: IronFlame Cleanroom Proof

on:
  push:
    branches:
      - song/ironflame-cleanroom-20260917
    paths:
      - .github/workflows/ironflame-cleanroom-proof.yml
      - projects/ironflame-cleanroom/production/**
      - projects/ironflame-cleanroom/analysis/audiomap.json
      - general/reusable/render_runtime/**
      - general/reusable/tools/scene_timeline.py

permissions:
  contents: write

jobs:
  proof:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install media tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg zip

      - name: Reconstruct verified canonical master
        shell: bash
        run: |
          set -euo pipefail
          PROD=projects/ironflame-cleanroom/production
          mkdir -p "$PROD/assets"
          cat projects/ironflame-cleanroom/assets/audio/canonical-wav.parts/part-* > "$PROD/assets/ironflame.wav"
          echo "76679c5e0d0c905635e80904ff67ba03b52c11893d3a71f09433e17feff0f962  $PROD/assets/ironflame.wav" | sha256sum -c -

      - name: Build canonical browser control map
        run: python projects/ironflame-cleanroom/production/build_control_map.py

      - name: Install isolated scene runtime
        working-directory: general/reusable/render_runtime
        run: npm install --omit=dev

      - name: Runtime doctor and local asset stage
        shell: bash
        run: |
          node general/reusable/render_runtime/runtime_doctor.mjs
          node general/reusable/render_runtime/stage_runtime_assets.mjs projects/ironflame-cleanroom/production

      - name: Validate authored timeline
        run: python general/reusable/tools/scene_timeline.py projects/ironflame-cleanroom/production/timeline.json --check-only

      - name: Browser composition QC
        shell: bash
        run: |
          mkdir -p projects/ironflame-cleanroom/proof
          node general/reusable/render_runtime/scene_qc.mjs projects/ironflame-cleanroom/production --no-snapshots --json | tee projects/ironflame-cleanroom/proof/runtime-qc.json

      - name: Capture representative proof frames
        shell: bash
        run: |
          set -euo pipefail
          BIN="$GITHUB_WORKSPACE/general/reusable/render_runtime/node_modules/.bin/hyperframes"
          OUT="$GITHUB_WORKSPACE/projects/ironflame-cleanroom/proof/snapshots"
          mkdir -p "$OUT"
          "$BIN" snapshot projects/ironflame-cleanroom/production \
            --at 2,31,79,120,165,188,210,233,244.4 \
            --no-end \
            --output "$OUT"
          ffmpeg -y -pattern_type glob -i "$OUT/frame-*.png" \
            -vf "scale=640:360,tile=3x3:padding=6:margin=6" \
            -frames:v 1 projects/ironflame-cleanroom/proof/contact-sheet.jpg
          (cd projects/ironflame-cleanroom/proof && zip -rq snapshots.zip snapshots)
          sha256sum projects/ironflame-cleanroom/proof/contact-sheet.jpg projects/ironflame-cleanroom/proof/snapshots.zip > projects/ironflame-cleanroom/proof/SHA256SUMS.txt

      - name: Publish proof media to GitHub Release storage
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=ironflame-cleanroom-proof-v1
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "IronFlame Cleanroom Proof v1" --notes "Molten Cartography deterministic proof frames generated from the verified canonical master and committed audiomap."
          fi
          gh release upload "$TAG" \
            projects/ironflame-cleanroom/proof/contact-sheet.jpg \
            projects/ironflame-cleanroom/proof/snapshots.zip \
            --clobber

      - name: Persist proof report without Actions artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf projects/ironflame-cleanroom/proof/snapshots projects/ironflame-cleanroom/proof/snapshots.zip projects/ironflame-cleanroom/proof/contact-sheet.jpg
          git config user.name "AIVideoEdit Production Bot"
          git config user.email "actions@users.noreply.github.com"
          git add projects/ironflame-cleanroom/proof/runtime-qc.json projects/ironflame-cleanroom/proof/SHA256SUMS.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record Molten Cartography proof QC [proof-output]"
          git push origin HEAD:${GITHUB_REF_NAME}
