name: Shifting Cycles Full Repo Production
on:
  workflow_dispatch:
  push:
    branches: [song/shifting-cycles-recursive-horizon]
    paths:
      - ".github/workflows/shifting-cycles-full-repo.yml"
permissions:
  contents: read
jobs:
  full-production:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AIVIDEOEDIT_AUTHORITY_REF: MainV2
      AIVIDEOEDIT_VALIDATION_MODE: "1"
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install full runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libsndfile1
          python -m pip install --quiet numpy opencv-python-headless soundfile onnxruntime pytest
      - name: Boot exact MainV2
        run: python bootstrap.py boot --repo-root "$GITHUB_WORKSPACE" --branch "$GITHUB_REF_NAME"
      - name: Resolve complete workflow plan
        run: |
          python .aivideoedit/os/general/reusable/tools/workflow_resolver.py --project "$GITHUB_WORKSPACE/projects/shifting-cycles-recursive-horizon" --json > workflow-plan.json
          cat workflow-plan.json
      - name: Fetch canonical production media
        run: |
          P="$GITHUB_WORKSPACE/projects/shifting-cycles-recursive-horizon/runtime_inputs"
          mkdir -p "$P"
          curl -fL --retry 2 --connect-timeout 20 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-5b3c-81f5-a9a0-e01ea49959d6/raw?se=2026-09-28T22%3A55%3A58Z&sp=r&sv=2026-02-06&sr=b&scid=061bc554-8a4f-5c12-97c3-6dbc998aa9a8&skoid=864daabb-d06a-46b3-a747-d35075313a83&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T22%3A49%3A27Z&ske=2026-09-29T22%3A49%3A27Z&sks=b&skv=2026-02-06&sig=X%2BiYSg4xWWoDHxo88AUyywW0NS8tiTsRjzN/i6MBF60%3D' -o "$P/Shifting_Cycles.wav"
          curl -fL --retry 2 --connect-timeout 20 'https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-c3b8-81f7-8a6c-11464d71085f/raw?se=2026-09-28T22%3A55%3A55Z&sp=r&sv=2026-02-06&sr=b&scid=d5c75b75-e76f-5cc1-b30c-bfccbd20c48c&skoid=864daabb-d06a-46b3-a747-d35075313a83&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T19%3A12%3A22Z&ske=2026-09-29T19%3A12%3A22Z&sks=b&skv=2026-02-06&sig=cGvI8PKc9gfy7M58dIJ4tikNVK8OdQp5b%2B4HmzWB9BM%3D' -o "$P/01_recursive_horizon_anchor.png"
          curl -fL --retry 2 --connect-timeout 20 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-87ec-81fd-9ac6-c9f48cf5446c/raw?se=2026-09-28T22%3A55%3A56Z&sp=r&sv=2026-02-06&sr=b&scid=7c5109c6-4b9e-595b-80e5-10d310721da2&skoid=864daabb-d06a-46b3-a747-d35075313a83&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T22%3A49%3A35Z&ske=2026-09-29T22%3A49%3A35Z&sks=b&skv=2026-02-06&sig=ML55QXF42WJPGDe/pwcHiM1Sle1H0pdbI8hVkwlMJnM%3D' -o "$P/02_celestial_orrery_observatory.png"
          curl -fL --retry 2 --connect-timeout 20 'https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-3208-81f7-a3fa-7658796306d4/raw?se=2026-09-28T22%3A55%3A55Z&sp=r&sv=2026-02-06&sr=b&scid=e9b861cf-e9be-58ab-82c6-34ba2b0de617&skoid=864daabb-d06a-46b3-a747-d35075313a83&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T22%3A42%3A37Z&ske=2026-09-29T22%3A42%3A37Z&sks=b&skv=2026-02-06&sig=oqA97AcKPhi8wdNkGg%2BRZPEXaaSjh%2BIhFO92SApQFu8%3D' -o "$P/03_golden_orbital_harmony_cityscape.png"
          curl -fL --retry 2 --connect-timeout 20 'https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-d044-81f7-b2f0-f87f8648be56/raw?se=2026-09-28T22%3A55%3A55Z&sp=r&sv=2026-02-06&sr=b&scid=f5ff5cd0-e95f-5542-885f-1f346d665588&skoid=864daabb-d06a-46b3-a747-d35075313a83&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T19%3A19%3A14Z&ske=2026-09-29T19%3A19%3A14Z&sks=b&skv=2026-02-06&sig=cByUNS68LVtewtRH9VsW2wldjcRIZk3IaQAhfDhCZqk%3D' -o "$P/04_golden_causeway_beneath_orbital_rings.png"
          curl -fL --retry 2 --connect-timeout 20 'https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-1778-81f7-abf6-eeceb196c06d/raw?se=2026-09-28T22%3A55%3A56Z&sp=r&sv=2026-02-06&sr=b&scid=55fe1f2d-910b-55c0-8f65-45fbe83edf46&skoid=864daabb-d06a-46b3-a747-d35075313a83&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T19%3A14%3A40Z&ske=2026-09-29T19%3A14%3A40Z&sks=b&skv=2026-02-06&sig=UMtPNXbMn7iHaYfCQmdZh/iTL/wo9uhiXOQ8%2BDK%2BfRQ%3D' -o "$P/05_celestial_ruins_cloudsea.png"
          curl -fL --retry 2 --connect-timeout 20 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-8bf4-81f5-8976-15dbb66aff77/raw?se=2026-09-28T22%3A55%3A57Z&sp=r&sv=2026-02-06&sr=b&scid=92d6f68d-1803-52fd-8604-4ba117f0eb65&skoid=864daabb-d06a-46b3-a747-d35075313a83&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T19%3A14%3A32Z&ske=2026-09-29T19%3A14%3A32Z&sks=b&skv=2026-02-06&sig=zH5rtuyhrKtBJRS6NAYT2Q/bbxQNu9%2BKAlp/F%2BzPBPA%3D' -o "$P/06_celestial_rings_golden_dawn.png"
          curl -fL --retry 2 --connect-timeout 20 'https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-3684-81f7-90b8-beeaf3acb0b4/raw?se=2026-09-28T22%3A55%3A56Z&sp=r&sv=2026-02-06&sr=b&scid=91ceddcc-a7b6-526f-841e-cfb9fa29b885&skoid=864daabb-d06a-46b3-a747-d35075313a83&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T22%3A39%3A25Z&ske=2026-09-29T22%3A39%3A25Z&sks=b&skv=2026-02-06&sig=318s3nFOmce9%2Bzqltkvhd/kVFnkbr/HHp4M0RPrnIAk%3D' -o "$P/07_celestial_golden_ring_metropolis.png"
          curl -fL --retry 2 --connect-timeout 20 'https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-8308-81f7-998a-ba5c6e4606af/raw?se=2026-09-28T22%3A55%3A57Z&sp=r&sv=2026-02-06&sr=b&scid=69bff551-9b17-5077-9990-1fb33a107405&skoid=864daabb-d06a-46b3-a747-d35075313a83&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T22%3A42%3A37Z&ske=2026-09-29T22%3A42%3A37Z&sks=b&skv=2026-02-06&sig=HJql1huMJZ0k9C8awFaJ0Yw%2BwPEdi%2BEc86quNHTz5QM%3D' -o "$P/08_golden_orbital_metropolis_sunset.png"
          curl -fL --retry 2 --connect-timeout 20 'https://sdmntprnorthcentralus.oaiusercontent.com/files/00000000-b418-822f-a086-7ae7709ca343/raw?se=2026-09-28T22%3A55%3A59Z&sp=r&sv=2026-02-06&sr=b&scid=84f26881-bb06-59d4-8890-b1a1d18c7874&skoid=864daabb-d06a-46b3-a747-d35075313a83&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T19%3A28%3A10Z&ske=2026-09-29T19%3A28%3A10Z&sks=b&skv=2026-02-06&sig=lBejoxyMpYaCIzwXOMEmLU3bPa%2BSeSNWIFw3XamHgmI%3D' -o "$P/09_cosmic_arcology_radiant_horizon.png"
          curl -fL --retry 2 --connect-timeout 20 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-f914-81f5-8d87-5ec0e3f8546c/raw?se=2026-09-28T22%3A55%3A58Z&sp=r&sv=2026-02-06&sr=b&scid=b2c614d8-2615-5c0e-b5c8-fb8280429eef&skoid=864daabb-d06a-46b3-a747-d35075313a83&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T19%3A18%3A56Z&ske=2026-09-29T19%3A18%3A56Z&sks=b&skv=2026-02-06&sig=NkFtUnCfTOYu03S7v0sHKS6p5hWLI8i6odqWQLSSk9Q%3D' -o "$P/10_concentric_rings_twilight.png"
          sha256sum "$P"/* | tee /tmp/source_hashes.txt
      - name: Provision pinned Beat This ONNX
        run: PYTHONPATH="$GITHUB_WORKSPACE" python general/reusable/tools/model_provision.py music-beat-onnx-v1
      - name: Run full resolved production
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python projects/shifting-cycles-recursive-horizon/run_full_repo_production.py             --media-dir projects/shifting-cycles-recursive-horizon/runtime_inputs             --audio projects/shifting-cycles-recursive-horizon/runtime_inputs/Shifting_Cycles.wav             --out-dir /tmp/shifting-full
      - name: Export source and runtime evidence
        if: always()
        run: |
          mkdir -p /tmp/shifting-full
          cp /tmp/source_hashes.txt /tmp/shifting-full/ 2>/dev/null || true
          cp workflow-plan.json /tmp/shifting-full/ 2>/dev/null || true
          cp projects/shifting-cycles-recursive-horizon/FX_REQUIREMENTS_FULL.json /tmp/shifting-full/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shifting-cycles-full-repo-production
          path: /tmp/shifting-full
          retention-days: 5
