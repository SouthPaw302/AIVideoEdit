          curl -fL --retry 2 --connect-timeout 20 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-b600-81f5-a6f8-41f8ff22ff74/raw?se=2026-09-29T00%3A17%3A19Z&sp=r&sv=2026-02-06&sr=b&scid=316783ee-9bc2-50f2-9587-7cf990efa873&skoid=864daabb-d06a-46b3-a747-d35075313a83&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T22%3A47%3A13Z&ske=2026-09-29T22%3A47%3A13Z&sks=b&skv=2026-02-06&sig=UqUHhsZg9p2omdItp0XA3SkWljHF2D1spEVeuSB9xbY%3D' -o "$P/04_golden_causeway_beneath_orbital_rings.png"
