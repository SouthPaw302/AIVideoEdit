name: Shifting Cycles Full Repo Production
on:
  workflow_dispatch:
  push:
    branches: [song/shifting-cycles-recursive-horizon]
    paths:
      - ".github/workflows/shifting-cycles-full-repo.yml"
permissions:
  contents: read
jobs:
  full-production:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AIVIDEOEDIT_AUTHORITY_REF: MainV2
      AIVIDEOEDIT_VALIDATION_MODE: "1"
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install full runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libsndfile1
          python -m pip install --quiet numpy opencv-python-headless soundfile onnxruntime pytest
      - name: Boot exact MainV2
        run: python bootstrap.py boot --repo-root "$GITHUB_WORKSPACE" --branch "$GITHUB_REF_NAME"
      - name: Resolve complete workflow plan
        run: |
          python .aivideoedit/os/general/reusable/tools/workflow_resolver.py --project "$GITHUB_WORKSPACE/projects/shifting-cycles-recursive-horizon" --json > workflow-plan.json
          cat workflow-plan.json
      - name: Fetch canonical production media
        run: |
          P="$GITHUB_WORKSPACE/projects/shifting-cycles-recursive-horizon/runtime_inputs"
          mkdir -p "$P"
          curl -fL --retry 2 --connect-timeout 20 'https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-6d20-81f7-a43e-36a87407535e/raw?se=2026-09-29T00%3A17%3A21Z&sp=r&sv=2026-02-06&sr=b&scid=d4f520d0-0737-51ce-8766-7f01e49327ba&skoid=864daabb-d06a-46b3-a747-d35075313a83&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T23%3A00%3A17Z&ske=2026-09-29T23%3A00%3A17Z&sks=b&skv=2026-02-06&sig=vKARvyFms6lEEil/AzARzzxvWBtBi%2BdiToX8/JWbgbY%3D' -o "$P/Shifting_Cycles.wav"
          curl -fL --retry 2 --connect-timeout 20 'https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-7868-81f7-bb7d-7ad33b6fe27b/raw?se=2026-09-29T00%3A17%3A19Z&sp=r&sv=2026-02-06&sr=b&scid=889bbd8e-a243-5ab4-aaec-133dc208b041&skoid=864daabb-d06a-46b3-a747-d35075313a83&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T22%3A46%3A50Z&ske=2026-09-29T22%3A46%3A50Z&sks=b&skv=2026-02-06&sig=w/vyIucUYkCIAbx4dxnFtG5p36kdFZVNRPc9SqV/WQo%3D' -o "$P/01_recursive_horizon_anchor.png"
          curl -fL --retry 2 --connect-timeout 20 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-391c-81f5-bc71-01a9fac98d22/raw?se=2026-09-29T00%3A17%3A19Z&sp=r&sv=2026-02-06&sr=b&scid=1392b0cd-caa5-54e4-8378-fb19fdc39248&skoid=864daabb-d06a-46b3-a747-d35075313a83&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T22%3A59%3A52Z&ske=2026-09-29T22%3A59%3A52Z&sks=b&skv=2026-02-06&sig=IBP6yYHhF/kqznTMIUfzz9DKaGTq9K9m5yGWQTrc5lM%3D' -o "$P/02_celestial_orrery_observatory.png"
