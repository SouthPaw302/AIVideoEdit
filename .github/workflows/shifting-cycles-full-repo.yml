          curl -fL --retry 2 --connect-timeout 20 'https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-3a6c-81f7-8967-dfe943fb06d0/raw?se=2026-09-29T00%3A17%3A21Z&sp=r&sv=2026-02-06&sr=b&scid=48077f4d-8b98-53dc-ad32-12cc0b5d5d52&skoid=864daabb-d06a-46b3-a747-d35075313a83&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T22%3A44%3A58Z&ske=2026-09-29T22%3A44%3A58Z&sks=b&skv=2026-02-06&sig=S7bp44ll7vge8d9e41biRxn4EuBxmmNG/pDp%2BZmPK8w%3D' -o "$P/06_celestial_rings_golden_dawn.png"
          curl -fL --retry 2 --connect-timeout 20 'https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-2e30-81f7-947a-e2e6e1a6226c/raw?se=2026-09-29T00%3A17%3A21Z&sp=r&sv=2026-02-06&sr=b&scid=03f7bcb2-dee8-5162-97bc-1154246cbc15&skoid=864daabb-d06a-46b3-a747-d35075313a83&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T22%3A49%3A26Z&ske=2026-09-29T22%3A49%3A26Z&sks=b&skv=2026-02-06&sig=XOKQ/QqSHYmMolLDfoRs4cqkTNy53Cch8nddgZXDf2Q%3D' -o "$P/07_celestial_golden_ring_metropolis.png"
          curl -fL --retry 2 --connect-timeout 20 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-bb28-81f5-9f5a-fc2801d68f15/raw?se=2026-09-29T00%3A17%3A21Z&sp=r&sv=2026-02-06&sr=b&scid=99ab261d-f55b-5472-a071-a9e757a46b58&skoid=864daabb-d06a-46b3-a747-d35075313a83&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T22%3A44%3A58Z&ske=2026-09-29T22%3A44%3A58Z&sks=b&skv=2026-02-06&sig=3fMEi6fk6WXhItUfd%2Bu9sNtOlSyZaMel7Gn9MAfk%2BME%3D' -o "$P/08_golden_orbital_metropolis_sunset.png"
          curl -fL --retry 2 --connect-timeout 20 'https://sdmntprsoutheastus3.oaiusercontent.com/files/00000000-c878-820c-a59a-b82ef775aa80/raw?se=2026-09-29T00%3A17%3A22Z&sp=r&sv=2026-02-06&sr=b&scid=cf13ada5-ee7e-5ae1-8dda-109d85651938&skoid=864daabb-d06a-46b3-a747-d35075313a83&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T22%3A42%3A44Z&ske=2026-09-29T22%3A42%3A44Z&sks=b&skv=2026-02-06&sig=fAXAWShlfChRLnkNGV0dVJGSKfoC49FVstfDSZXNf10%3D' -o "$P/09_cosmic_arcology_radiant_horizon.png"
          curl -fL --retry 2 --connect-timeout 20 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-6cdc-81f5-83cc-9cdaf79511c2/raw?se=2026-09-29T00%3A17%3A23Z&sp=r&sv=2026-02-06&sr=b&scid=a8eb5b24-b990-5863-ae33-e446667bfd4f&skoid=864daabb-d06a-46b3-a747-d35075313a83&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T22%3A54%3A03Z&ske=2026-09-29T22%3A54%3A03Z&sks=b&skv=2026-02-06&sig=31R7epyzrb%2B71wk6YX8LLLL2soFLHHgKLQS/dOsTJF4%3D' -o "$P/10_concentric_rings_twilight.png"
          sha256sum "$P"/* | tee /tmp/source_hashes.txt
      - name: Provision pinned Beat This ONNX
        run: PYTHONPATH="$GITHUB_WORKSPACE" python general/reusable/tools/model_provision.py music-beat-onnx-v1
      - name: Run full resolved production
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python projects/shifting-cycles-recursive-horizon/run_full_repo_production.py             --media-dir projects/shifting-cycles-recursive-horizon/runtime_inputs             --audio projects/shifting-cycles-recursive-horizon/runtime_inputs/Shifting_Cycles.wav             --out-dir /tmp/shifting-full
      - name: Export source and runtime evidence
        if: always()
        run: |
          mkdir -p /tmp/shifting-full
          cp /tmp/source_hashes.txt /tmp/shifting-full/ 2>/dev/null || true
          cp workflow-plan.json /tmp/shifting-full/ 2>/dev/null || true
          cp projects/shifting-cycles-recursive-horizon/FX_REQUIREMENTS_FULL.json /tmp/shifting-full/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shifting-cycles-full-repo-production
          path: /tmp/shifting-full
          retention-days: 5


