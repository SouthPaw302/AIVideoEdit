name: Shifting Cycles Full Repo Production
on:
  workflow_dispatch:
  push:
    branches: [song/shifting-cycles-recursive-horizon]
    paths:
      - ".github/workflows/shifting-cycles-full-repo.yml"
permissions:
  contents: read
jobs:
  full-production:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AIVIDEOEDIT_AUTHORITY_REF: MainV2
      AIVIDEOEDIT_VALIDATION_MODE: "1"
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install full runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libsndfile1
          python -m pip install --quiet numpy opencv-python-headless soundfile onnxruntime pytest
      - name: Boot exact MainV2
        run: python bootstrap.py boot --repo-root "$GITHUB_WORKSPACE" --branch "$GITHUB_REF_NAME"
      - name: Resolve complete workflow plan
        run: |
          python .aivideoedit/os/general/reusable/tools/workflow_resolver.py --project "$GITHUB_WORKSPACE/projects/shifting-cycles-recursive-horizon" --json > workflow-plan.json
          cat workflow-plan.json
      - name: Fetch canonical production media
        run: |
          P="$GITHUB_WORKSPACE/projects/shifting-cycles-recursive-horizon/runtime_inputs"
          mkdir -p "$P"
          curl -fL --retry 2 --connect-timeout 20 'https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-d0c0-81f7-b631-d52b3d9d569d/raw?se=2026-09-28T23%3A19%3A54Z&sp=r&sv=2026-02-06&sr=b&scid=6a70cd34-62fd-5b8a-a458-e5918828a13b&skoid=b869bb08-96ac-4184-ab38-9c45e2890c4c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T20%3A59%3A23Z&ske=2026-09-29T20%3A59%3A23Z&sks=b&skv=2026-02-06&sig=5ie22V%2BA/m/mErZkvJypTsMB1dEwUtyD57oi5m2VkNY%3D' -o "$P/Shifting_Cycles.wav"
          curl -fL --retry 2 --connect-timeout 20 'https://sdmntprwestus.oaiusercontent.com/files/00000000-dc28-8230-8fe7-9db499b39d67/raw?se=2026-09-28T23%3A19%3A50Z&sp=r&sv=2026-02-06&sr=b&scid=ab92cbf9-b155-597c-b95d-e650443dc818&skoid=b869bb08-96ac-4184-ab38-9c45e2890c4c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T20%3A56%3A51Z&ske=2026-09-29T20%3A56%3A51Z&sks=b&skv=2026-02-06&sig=1X1URPlSu1SkH6YE4bBsW5ibGP68hJFHeHo81Y5Ed8k%3D' -o "$P/01_recursive_horizon_anchor.png"
          curl -fL --retry 2 --connect-timeout 20 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-4280-81fd-8e49-6d157b2b09d4/raw?se=2026-09-28T23%3A19%3A50Z&sp=r&sv=2026-02-06&sr=b&scid=989dc8ab-b940-58f1-94a9-07242f62f774&skoid=b869bb08-96ac-4184-ab38-9c45e2890c4c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T20%3A43%3A54Z&ske=2026-09-29T20%3A43%3A54Z&sks=b&skv=2026-02-06&sig=hV0/PsKiQ%2BWG0nG6k1pHhB5z2CNy9tHsggwHZE20b3o%3D' -o "$P/02_celestial_orrery_observatory.png"
