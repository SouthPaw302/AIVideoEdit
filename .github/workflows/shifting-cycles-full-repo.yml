          curl -fL --retry 2 --connect-timeout 20 'https://sdmntprwestus.oaiusercontent.com/files/00000000-bef4-8230-a1d7-84c0fe82d306/raw?se=2026-09-28T23%3A19%3A52Z&sp=r&sv=2026-02-06&sr=b&scid=d9e1f473-5a36-5d75-8e0a-23d0d21452fc&skoid=b869bb08-96ac-4184-ab38-9c45e2890c4c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T21%3A57%3A06Z&ske=2026-09-29T21%3A57%3A06Z&sks=b&skv=2026-02-06&sig=gEgFFN96/U8Zb5LTIEZJGel/MDrSHf6Z7osxlu4kBao%3D' -o "$P/05_celestial_ruins_cloudsea.png"
          curl -fL --retry 2 --connect-timeout 20 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-f5ec-81fd-8d85-eba692b11822/raw?se=2026-09-28T23%3A19%3A52Z&sp=r&sv=2026-02-06&sr=b&scid=18862c29-b71f-5bd1-ac92-d670f3259131&skoid=b869bb08-96ac-4184-ab38-9c45e2890c4c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T20%3A59%3A28Z&ske=2026-09-29T20%3A59%3A28Z&sks=b&skv=2026-02-06&sig=H9pEU9JjZ7ttIsk8rpbwuYJjhYP0xnGX8upL8XWmQIk%3D' -o "$P/06_celestial_rings_golden_dawn.png"
          curl -fL --retry 2 --connect-timeout 20 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-f488-81fd-8bd2-ae778d3348bc/raw?se=2026-09-28T23%3A19%3A52Z&sp=r&sv=2026-02-06&sr=b&scid=77a9721f-7081-581d-98e5-409eca5c5a36&skoid=b869bb08-96ac-4184-ab38-9c45e2890c4c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T20%3A49%3A11Z&ske=2026-09-29T20%3A49%3A11Z&sks=b&skv=2026-02-06&sig=/8acw2bCbYkRLePTIT0y3TY1%2BYjHDDdU4b%2BHX%2BPPdWw%3D' -o "$P/07_celestial_golden_ring_metropolis.png"
          curl -fL --retry 2 --connect-timeout 20 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-232c-81fd-a615-b745022b6d88/raw?se=2026-09-28T23%3A19%3A52Z&sp=r&sv=2026-02-06&sr=b&scid=9bc92058-a091-5d70-bf2b-4cf7dfe4929e&skoid=b869bb08-96ac-4184-ab38-9c45e2890c4c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T20%3A41%3A04Z&ske=2026-09-29T20%3A41%3A04Z&sks=b&skv=2026-02-06&sig=lweXJAL6mbrQJxvXMLC/AqTMJxaIU6Bs4Hq2Cuo84As%3D' -o "$P/08_golden_orbital_metropolis_sunset.png"
          curl -fL --retry 2 --connect-timeout 20 'https://sdmntprwestus.oaiusercontent.com/files/00000000-3ed8-8230-96eb-1b8383f3cd12/raw?se=2026-09-28T23%3A19%3A54Z&sp=r&sv=2026-02-06&sr=b&scid=28464bb7-a12b-5043-931d-f31baa1c19ca&skoid=b869bb08-96ac-4184-ab38-9c45e2890c4c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T20%3A44%3A00Z&ske=2026-09-29T20%3A44%3A00Z&sks=b&skv=2026-02-06&sig=ZPipbiqVL2x35NYa3GFOxjy7ZALxLVAWSRaaPdnQrfQ%3D' -o "$P/09_cosmic_arcology_radiant_horizon.png"
          curl -fL --retry 2 --connect-timeout 20 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-e93c-81fd-8c85-ee14d6270e89/raw?se=2026-09-28T23%3A19%3A54Z&sp=r&sv=2026-02-06&sr=b&scid=74eb255f-095b-5f23-8349-11aa52b306d1&skoid=b869bb08-96ac-4184-ab38-9c45e2890c4c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T21%3A01%3A39Z&ske=2026-09-29T21%3A01%3A39Z&sks=b&skv=2026-02-06&sig=fg%2BEBLJJN47MO1B//os%2BYukWRjwHy5AcT0Ewef6mD8M%3D' -o "$P/10_concentric_rings_twilight.png"
          sha256sum "$P"/* | tee /tmp/source_hashes.txt
      - name: Provision pinned Beat This ONNX
        run: PYTHONPATH="$GITHUB_WORKSPACE" python general/reusable/tools/model_provision.py music-beat-onnx-v1
      - name: Run full resolved production
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python projects/shifting-cycles-recursive-horizon/run_full_repo_production.py             --media-dir projects/shifting-cycles-recursive-horizon/runtime_inputs             --audio projects/shifting-cycles-recursive-horizon/runtime_inputs/Shifting_Cycles.wav             --out-dir /tmp/shifting-full
      - name: Export source and runtime evidence
        if: always()
        run: |
          mkdir -p /tmp/shifting-full
          cp /tmp/source_hashes.txt /tmp/shifting-full/ 2>/dev/null || true
          cp workflow-plan.json /tmp/shifting-full/ 2>/dev/null || true
          cp projects/shifting-cycles-recursive-horizon/FX_REQUIREMENTS_FULL.json /tmp/shifting-full/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shifting-cycles-full-repo-production
          path: /tmp/shifting-full
          retention-days: 5

