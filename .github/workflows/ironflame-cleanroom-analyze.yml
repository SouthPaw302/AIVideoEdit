name: IronFlame Cleanroom Analyze

on:
  push:
    branches:
      - song/ironflame-cleanroom-20260917
    paths:
      - .github/workflows/ironflame-cleanroom-analyze.yml
      - projects/ironflame-cleanroom/assets/audio/**
      - general/reusable/tools/audio_map.py

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Reconstruct and verify canonical WAV
        shell: bash
        run: |
          set -euo pipefail
          AUDIO=/tmp/ironflame-remastered.wav
          cat projects/ironflame-cleanroom/assets/audio/canonical-wav.parts/part-* > "$AUDIO"
          echo "76679c5e0d0c905635e80904ff67ba03b52c11893d3a71f09433e17feff0f962  $AUDIO" | sha256sum -c -
          ffprobe -v error -show_format -show_streams -of json "$AUDIO" > /tmp/source-probe.json

      - name: Install deterministic analysis dependencies
        run: python -m pip install --disable-pip-version-check librosa numpy soundfile

      - name: Build canonical AIVideoEdit audio map
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p projects/ironflame-cleanroom/analysis
          python general/reusable/tools/audio_map.py /tmp/ironflame-remastered.wav \
            -o projects/ironflame-cleanroom/analysis/audiomap.json \
            --print | tee projects/ironflame-cleanroom/analysis/audio-analysis-summary.json
          cp /tmp/source-probe.json projects/ironflame-cleanroom/analysis/source-probe.json
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          p=Path('/tmp/ironflame-remastered.wav')
          h=hashlib.sha256(p.read_bytes()).hexdigest()
          probe=json.loads(Path('/tmp/source-probe.json').read_text())
          out={
            'schema':'aivideoedit.source-verification.v1',
            'file':'Ironflame (Remastered).wav',
            'sha256':h,
            'expected_sha256':'76679c5e0d0c905635e80904ff67ba03b52c11893d3a71f09433e17feff0f962',
            'sha256_match':h=='76679c5e0d0c905635e80904ff67ba03b52c11893d3a71f09433e17feff0f962',
            'bytes':p.stat().st_size,
            'probe':probe,
          }
          Path('projects/ironflame-cleanroom/analysis/source-verification.json').write_text(json.dumps(out,indent=2)+'\n')
          if not out['sha256_match']:
            raise SystemExit('canonical source hash mismatch')
          PY

      - name: Commit verified analysis to production branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AIVideoEdit Production Bot"
          git config user.email "actions@users.noreply.github.com"
          git add projects/ironflame-cleanroom/analysis
          if git diff --cached --quiet; then
            echo "Analysis already current."
            exit 0
          fi
          git commit -m "Analyze canonical IronFlame audio [analysis-output]"
          git push origin HEAD:${GITHUB_REF_NAME}
