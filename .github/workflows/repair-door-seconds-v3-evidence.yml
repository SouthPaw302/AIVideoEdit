name: Repair Door Seconds Pandora v3 Evidence

on:
  push:
    branches:
      - song/the-door-between-the-seconds
    paths:
      - .github/workflows/repair-door-seconds-v3-evidence.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: song/the-door-between-the-seconds
          fetch-depth: 0

      - name: Normalize rendered evidence and asset authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('projects/the-door-between-the-seconds')
          allowed = {'generated','ingested','derived','accepted'}

          # Normalize every shot package evidence status to the validator vocabulary.
          changed_packages = 0
          for f in sorted((p/'shot_packages').glob('S*/package.json')):
              d = json.loads(f.read_text(encoding='utf-8'))
              changed = False
              for item in d.get('media_evidence', []):
                  if item.get('status') not in allowed:
                      item['status'] = 'accepted'
                      changed = True
              if changed:
                  f.write_text(json.dumps(d, indent=2) + '\n', encoding='utf-8')
                  changed_packages += 1

          # Make the generated production sources visible to the canonical asset manifest.
          bank = json.loads((p/'production/generated_scene_bank/SCENE_BANK_MANIFEST.json').read_text(encoding='utf-8'))
          am_path = p/'ASSET_MANIFEST.json'
          am = json.loads(am_path.read_text(encoding='utf-8'))
          assets = am.setdefault('assets', [])
          existing = {a.get('id') for a in assets if isinstance(a, dict)}
          for i, a in enumerate(bank.get('assets', []), 1):
              aid = f'PANDORA_V3_SCENE_{i:02d}'
              if aid in existing:
                  continue
              assets.append({
                  'id': aid,
                  'kind': 'generated_visual',
                  'origin': 'generated',
                  'role': 'generated_production_source',
                  'name': a['name'],
                  'path': f"production/generated_scene_bank/{a['name']}",
                  'family': a.get('family'),
                  'sha256': a['sha256'],
                  'bytes': a['bytes'],
                  'width': 960,
                  'height': 540,
                  'status': 'accepted'
              })
          am_path.write_text(json.dumps(am, indent=2) + '\n', encoding='utf-8')

          # Prevent the next picture rebuild from reintroducing the invalid evidence token.
          renderer = p/'production/build_branch_picture.py'
          txt = renderer.read_text(encoding='utf-8')
          txt2 = txt.replace('"status":"verified"', '"status":"accepted"')
          if txt2 == txt:
              raise SystemExit('renderer evidence status pattern not found; refusing silent repair')
          renderer.write_text(txt2, encoding='utf-8')

          print(json.dumps({'shot_packages_normalized': changed_packages,
                            'asset_manifest_assets': len(assets),
                            'renderer_future_status': 'accepted'}, indent=2))
          PY

      - name: Commit normalized evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/the-door-between-the-seconds/ASSET_MANIFEST.json \
                  projects/the-door-between-the-seconds/production/build_branch_picture.py \
                  projects/the-door-between-the-seconds/shot_packages
          git commit -m "Normalize Pandora v3 rendered evidence"
          git push origin HEAD:song/the-door-between-the-seconds
