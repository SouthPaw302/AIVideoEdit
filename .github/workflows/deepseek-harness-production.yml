name: DeepSeek Harness Production Probe

on:
  push:
    branches:
      - prototype/deepseek-harness
    paths:
      - ".github/workflows/deepseek-harness-production.yml"
      - "prototype/backend_gui/deepseek_harness/production_probe.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-probe:
    runs-on: ubuntu-latest
    env:
      AIVE_RUNTIME: /tmp/aive-runtime
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/deepseek-harness
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Assert branch isolation
        shell: bash
        run: |
          test "$(git branch --show-current)" = "prototype/deepseek-harness"
          echo "PASS: prototype branch isolated"

      - name: Install FFmpeg
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg

      - name: Download production media
        shell: bash
        env:
          AUDIO_URL: "https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-40d8-81f7-b286-5115a458d4e2/raw?se=2026-09-18T08%3A04%3A51Z&sp=r&sv=2026-02-06&sr=b&scid=110bba33-8203-58f4-a66a-1e0393bba5e5&skoid=864daabb-d06a-46b3-a747-d35075313a83&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-18T02%3A05%3A11Z&ske=2026-09-19T02%3A05%3A11Z&sks=b&skv=2026-02-06&sig=v5ZmE/FvWvC0gNP46cuDD5jBIO8emvqd9qSeAj9Z/QU%3D"
          VIDEO_URL: "https://sdmntprcentralus.oaiusercontent.com/files/00000000-1b9c-81f5-a931-224192549054/raw?se=2026-09-18T08%3A04%3A52Z&sp=r&sv=2026-02-06&sr=b&scid=86f9aad7-c9a1-505e-aac7-9df749cf2d5c&skoid=864daabb-d06a-46b3-a747-d35075313a83&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-18T02%3A18%3A09Z&ske=2026-09-19T02%3A18%3A09Z&sks=b&skv=2026-02-06&sig=809FlZ7eXaNqhb4zuzsNTWbOMXFJDOVu8247wCf8aTo%3D"
        run: |
          mkdir -p "/tmp/source"
          curl -fL --retry 3 "$AUDIO_URL" -o "/tmp/source/Midnight Tribal Pulse (Remastered).mp3"
          curl -fL --retry 3 "$VIDEO_URL" -o "/tmp/source/mescalito_living_scene.mp4"

      - name: Run production-direction probe through Tool API
        shell: bash
        run: |
          python prototype/backend_gui/deepseek_harness/production_probe.py             --audio "/tmp/source/Midnight Tribal Pulse (Remastered).mp3"             --video "/tmp/source/mescalito_living_scene.mp4"             --evidence-dir "/tmp/evidence"

      - name: Package evidence
        shell: bash
        run: |
          tar -czf "/tmp/deepseek-harness-direction-evidence.tgz" -C "/tmp/evidence" .

      - uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-direction-evidence
          path: /tmp/deepseek-harness-direction-evidence.tgz
          retention-days: 3
