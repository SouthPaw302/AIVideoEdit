name: DeepSeek Harness Optional Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: MainV2
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run provider-neutral Harness MCP smoke test
        run: python prototype/backend_gui/harness_selftest.py

      - name: Confirm Harness remains optional
        run: |
          python - <<'PY'
          from runtime_v2.harness.adapter import status
          s = status(False).as_dict()
          assert s["enabled"] is False
          assert s["provider_neutral"] is True
          assert s["production_authority"] == "aivideoedit"
          print("PASS: Harness optional/provider-neutral")
          PY
