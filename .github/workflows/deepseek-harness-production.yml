name: DeepSeek Harness Production Probe

on:
  push:
    branches:
      - prototype/deepseek-harness
    paths:
      - ".github/workflows/deepseek-harness-production.yml"
      - "prototype/backend_gui/deepseek_harness/production_probe.py"
      - "prototype/backend_gui/production_project.py"
  workflow_dispatch:

jobs:
  production-probe:
    runs-on: ubuntu-latest
    env:
      AIVE_RUNTIME: /tmp/aive-runtime
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/deepseek-harness
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Assert branch isolation
        run: |
          test "$(git branch --show-current)" = "prototype/deepseek-harness"

      - name: Download supplied media
        env:
          AUDIO_URL: "https://sdmntprnorthcentralus.oaiusercontent.com/files/00000000-97fc-822f-bd7e-bc7ec2e04eef/raw?se=2026-09-18T08%3A15%3A24Z&sp=r&sv=2026-02-06&sr=b&scid=7b3f2a43-b98b-5494-95b1-baa096ef2c0b&skoid=864daabb-d06a-46b3-a747-d35075313a83&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-18T02%3A24%3A18Z&ske=2026-09-19T02%3A24%3A18Z&sks=b&skv=2026-02-06&sig=HWs1qdvga7VzVmg%2BMd0ltNNfhkK%2BVwtidPjCShv3imk%3D"
          VIDEO_URL: "https://sdmntprcentralus.oaiusercontent.com/files/00000000-cf30-81f5-baa2-c9913b78be20/raw?se=2026-09-18T08%3A15%3A24Z&sp=r&sv=2026-02-06&sr=b&scid=af08aa60-8a65-5338-9d12-258d77fb3dea&skoid=864daabb-d06a-46b3-a747-d35075313a83&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-18T02%3A13%3A42Z&ske=2026-09-19T02%3A13%3A42Z&sks=b&skv=2026-02-06&sig=9tKzybtDE4XKaEDHva7w/lxflrADzAPN1bD5PQO33Nc%3D"
        run: |
          mkdir -p /tmp/source
          curl -fL --retry 3 "$AUDIO_URL" -o "/tmp/source/Midnight Tribal Pulse (Remastered).mp3"
          curl -fL --retry 3 "$VIDEO_URL" -o "/tmp/source/mescalito_living_scene.mp4"

      - name: Install FFmpeg
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg

      - name: Run production-direction probe
        run: |
          python prototype/backend_gui/deepseek_harness/production_probe.py \
            --audio "/tmp/source/Midnight Tribal Pulse (Remastered).mp3" \
            --video "/tmp/source/mescalito_living_scene.mp4" \
            --evidence-dir "/tmp/evidence"

      - name: Package evidence
        if: always()
        run: |
          if [ -d /tmp/evidence ]; then
            tar -czf /tmp/deepseek-harness-direction-evidence.tgz -C /tmp/evidence .
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deepseek-harness-direction-evidence
          path: /tmp/deepseek-harness-direction-evidence.tgz
          if-no-files-found: ignore
          retention-days: 3
