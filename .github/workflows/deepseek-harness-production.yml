name: DeepSeek Harness Production Probe

on:
  push:
    branches:
      - prototype/deepseek-harness
    paths:
      - ".github/workflows/deepseek-harness-production.yml"
      - "prototype/backend_gui/deepseek_harness/production_probe.py"
      - "prototype/backend_gui/production_project.py"
      - "prototype/backend_gui/production_operating_order.py"
  workflow_dispatch:

jobs:
  production-probe:
    runs-on: ubuntu-latest
    env:
      AIVE_RUNTIME: /tmp/aive-runtime
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/deepseek-harness
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Assert branch isolation
        run: |
          test "$(git branch --show-current)" = "prototype/deepseek-harness"

      - name: Download supplied media
        env:
          AUDIO_URL: "https://sdmntprcentralus.oaiusercontent.com/files/00000000-cc9c-81f5-914c-a5be69d73ad9/raw?se=2026-09-18T08%3A20%3A26Z&sp=r&sv=2026-02-06&sr=b&scid=dc01b74c-5732-5abe-8a05-086363ba2311&skoid=864daabb-d06a-46b3-a747-d35075313a83&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-18T02%3A17%3A56Z&ske=2026-09-19T02%3A17%3A56Z&sks=b&skv=2026-02-06&sig=CNf4qDnStvr6iUiEkjrodn7sFKMa68wv53vepYKrHzk%3D"
          VIDEO_URL: "https://sdmntpreastus2.oaiusercontent.com/files/00000000-6690-81f6-8c9b-5b7d72a3027d/raw?se=2026-09-18T08%3A20%3A25Z&sp=r&sv=2026-02-06&sr=b&scid=58b89612-5c7d-567d-95e7-ba37a7ec66fd&skoid=864daabb-d06a-46b3-a747-d35075313a83&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-18T02%3A15%3A57Z&ske=2026-09-19T02%3A15%3A57Z&sks=b&skv=2026-02-06&sig=n94VbAQAtaKvSur8kCxpDkFfuz5/ljjbpun%2BjmiXaLw%3D"
        run: |
          mkdir -p /tmp/source
          curl -fL --retry 3 "$AUDIO_URL" -o "/tmp/source/Midnight Tribal Pulse (Remastered).mp3"
          curl -fL --retry 3 "$VIDEO_URL" -o "/tmp/source/mescalito_living_scene.mp4"

      - name: Install FFmpeg
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg

      - name: Run production-direction probe
        run: |
          python prototype/backend_gui/deepseek_harness/production_probe.py \
            --audio "/tmp/source/Midnight Tribal Pulse (Remastered).mp3" \
            --video "/tmp/source/mescalito_living_scene.mp4" \
            --evidence-dir "/tmp/evidence"

      - name: Package evidence
        if: always()
        run: |
          if [ -d /tmp/evidence ]; then
            tar -czf /tmp/deepseek-harness-direction-evidence.tgz -C /tmp/evidence .
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deepseek-harness-direction-evidence
          path: /tmp/deepseek-harness-direction-evidence.tgz
          if-no-files-found: ignore
          retention-days: 3
