name: DeepSeek Harness Production Probe

on:
  push:
    branches:
      - prototype/deepseek-harness
    paths:
      - ".github/workflows/deepseek-harness-production.yml"
      - "prototype/backend_gui/deepseek_harness/production_probe.py"
  workflow_dispatch:

jobs:
  production-probe:
    runs-on: ubuntu-latest
    env:
      AIVE_RUNTIME: /tmp/aive-runtime
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/deepseek-harness
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Assert branch isolation
        run: |
          test "$(git branch --show-current)" = "prototype/deepseek-harness"

      - name: Download supplied media
        env:
          AUDIO_URL: "https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-ed8c-81f7-ad5e-76eb76824b56/raw?se=2026-09-18T08%3A13%3A06Z&sp=r&sv=2026-02-06&sr=b&scid=df0f83d4-5f4f-51c0-960f-4e2c04548d64&skoid=864daabb-d06a-46b3-a747-d35075313a83&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-18T02%3A18%3A12Z&ske=2026-09-19T02%3A18%3A12Z&sks=b&skv=2026-02-06&sig=mG3iv1zQKCL2AjNv9UCIb73YYJ6NmFQFfe7fAACxKOk%3D"
          VIDEO_URL: "https://sdmntpreastus2.oaiusercontent.com/files/00000000-dddc-81f6-a222-f3bd65181d20/raw?se=2026-09-18T08%3A13%3A06Z&sp=r&sv=2026-02-06&sr=b&scid=9c0f303b-e318-547b-945f-cfa6212f7423&skoid=864daabb-d06a-46b3-a747-d35075313a83&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-18T02%3A24%3A40Z&ske=2026-09-19T02%3A24%3A40Z&sks=b&skv=2026-02-06&sig=B/aBqK8g9MGYtN7FsueFNVGYd0xJeHLVkQAHrYqbBvA%3D"
        run: |
          mkdir -p /tmp/source
          curl -fL --retry 3 "$AUDIO_URL" -o "/tmp/source/Midnight Tribal Pulse (Remastered).mp3"
          curl -fL --retry 3 "$VIDEO_URL" -o "/tmp/source/mescalito_living_scene.mp4"

      - name: Install FFmpeg
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg

      - name: Run production-direction probe
        run: |
          python prototype/backend_gui/deepseek_harness/production_probe.py \
            --audio "/tmp/source/Midnight Tribal Pulse (Remastered).mp3" \
            --video "/tmp/source/mescalito_living_scene.mp4" \
            --evidence-dir "/tmp/evidence"

      - name: Package evidence
        if: always()
        run: |
          if [ -d /tmp/evidence ]; then
            tar -czf /tmp/deepseek-harness-direction-evidence.tgz -C /tmp/evidence .
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deepseek-harness-direction-evidence
          path: /tmp/deepseek-harness-direction-evidence.tgz
          if-no-files-found: ignore
          retention-days: 3
