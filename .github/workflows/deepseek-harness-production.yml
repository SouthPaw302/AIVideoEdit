name: DeepSeek Harness Production Probe

on:
  push:
    branches:
      - prototype/deepseek-harness
    paths:
      - ".github/workflows/deepseek-harness-production.yml"
      - "prototype/backend_gui/deepseek_harness/production_probe.py"
      - "prototype/backend_gui/production_project.py"
  workflow_dispatch:

jobs:
  production-probe:
    runs-on: ubuntu-latest
    env:
      AIVE_RUNTIME: /tmp/aive-runtime
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/deepseek-harness
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Assert branch isolation
        run: |
          test "$(git branch --show-current)" = "prototype/deepseek-harness"

      - name: Download supplied media
        env:
          AUDIO_URL: "https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-4348-81f7-9166-183f30c767d3/raw?se=2026-09-18T08%3A18%3A47Z&sp=r&sv=2026-02-06&sr=b&scid=9122ab3b-cb9c-5af5-a728-20e016b8a955&skoid=864daabb-d06a-46b3-a747-d35075313a83&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-18T02%3A09%3A27Z&ske=2026-09-19T02%3A09%3A27Z&sks=b&skv=2026-02-06&sig=weVBZMcNgqXZ/aMwmawWEWQv1N1A6eRdEenMY7aIdaw%3D"
          VIDEO_URL: "https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-73e0-81f7-8678-79c3c2450ac8/raw?se=2026-09-18T08%3A18%3A46Z&sp=r&sv=2026-02-06&sr=b&scid=c9cbec7b-a278-522c-a120-195b432da898&skoid=864daabb-d06a-46b3-a747-d35075313a83&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-18T02%3A22%3A18Z&ske=2026-09-19T02%3A22%3A18Z&sks=b&skv=2026-02-06&sig=uvyj5uaaliRGrsTmkdsNsZie%2B0u1wKIUTNAnunJaOq0%3D"
        run: |
          mkdir -p /tmp/source
          curl -fL --retry 3 "$AUDIO_URL" -o "/tmp/source/Midnight Tribal Pulse (Remastered).mp3"
          curl -fL --retry 3 "$VIDEO_URL" -o "/tmp/source/mescalito_living_scene.mp4"

      - name: Install FFmpeg
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg

      - name: Run production-direction probe
        run: |
          python prototype/backend_gui/deepseek_harness/production_probe.py \
            --audio "/tmp/source/Midnight Tribal Pulse (Remastered).mp3" \
            --video "/tmp/source/mescalito_living_scene.mp4" \
            --evidence-dir "/tmp/evidence"

      - name: Package evidence
        if: always()
        run: |
          if [ -d /tmp/evidence ]; then
            tar -czf /tmp/deepseek-harness-direction-evidence.tgz -C /tmp/evidence .
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deepseek-harness-direction-evidence
          path: /tmp/deepseek-harness-direction-evidence.tgz
          if-no-files-found: ignore
          retention-days: 3
