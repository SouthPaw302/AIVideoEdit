name: Shifting Cycles Music Revamp Camera Pass
on:
  workflow_dispatch:
  push:
    branches:
      - song/shifting-cycles-recursive-horizon
    paths:
      - .github/workflows/shifting-cycles-music-revamp.yml
jobs:
  camera-recut:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      AIVIDEOEDIT_AUTHORITY_REF: MainV2
      AIVIDEOEDIT_VALIDATION_MODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -q opencv-python-headless numpy
      - name: Boot MainV2 authority
        run: python bootstrap.py boot --repo-root "$GITHUB_WORKSPACE" --branch "$GITHUB_REF_NAME"
      - name: Fetch approved visual master proxy
        run: |
          mkdir -p /tmp/aive_work
          curl -fL --retry 2 'https://sdmntprwestus.oaiusercontent.com/files/00000000-a6c4-8230-b83d-71bfaa6394e7/raw?se=2026-09-29T02%3A16%3A08Z&sp=r&sv=2026-02-06&sr=b&scid=af8cfa45-7d98-5219-9dd7-d89e054abdba&skoid=864daabb-d06a-46b3-a747-d35075313a83&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T22%3A59%3A53Z&ske=2026-09-29T22%3A59%3A53Z&sks=b&skv=2026-02-06&sig=QeoWQMPtXZfI3VHNT5QCSJdUMxnkEpgY5C7Fim4XCOg%3D' -o /tmp/aive_work/master.mp4
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height,r_frame_rate -of json /tmp/aive_work/master.mp4
      - name: Fetch canonical music and detail stills
        run: |
          curl -fL --retry 2 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-817c-81f5-95df-c38d3f79d51e/raw?se=2026-09-29T02%3A16%3A18Z&sp=r&sv=2026-02-06&sr=b&scid=406e7be4-5fa5-5795-8c19-08fc7cd43250&skoid=864daabb-d06a-46b3-a747-d35075313a83&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T02%3A08%3A50Z&ske=2026-09-30T02%3A08%3A50Z&sks=b&skv=2026-02-06&sig=o0qDrU1HhRrivwdH8s4X0XTDkVCnAZrbKLrPkAjMu9M%3D' -o /tmp/aive_work/music.wav
          curl -fL --retry 2 'https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-50c0-81f7-90bd-a2ec2013f311/raw?se=2026-09-29T02%3A16%3A03Z&sp=r&sv=2026-02-06&sr=b&scid=3fbe095f-1015-5eac-9a87-04f7c712a9c3&skoid=864daabb-d06a-46b3-a747-d35075313a83&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T22%3A44%3A58Z&ske=2026-09-29T22%3A44%3A58Z&sks=b&skv=2026-02-06&sig=FruMFh6HZECSyFsVdSs3RsVi7tVRM0VAxrLdyP0Wr14%3D' -o /tmp/aive_work/04_golden_causeway_beneath_orbital_rings.png
          curl -fL --retry 2 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-e1c0-81f5-95c7-884bb394b81e/raw?se=2026-09-29T02%3A16%3A03Z&sp=r&sv=2026-02-06&sr=b&scid=9e6885e7-e1d3-5d38-9e68-be74d8935a79&skoid=864daabb-d06a-46b3-a747-d35075313a83&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T02%3A11%3A02Z&ske=2026-09-30T02%3A11%3A02Z&sks=b&skv=2026-02-06&sig=yQAGowQqLCrmPtmddjThi94IUpDCP67V0s/EH41N1nM%3D' -o /tmp/aive_work/09_cosmic_arcology_radiant_horizon.png
          curl -fL --retry 2 'https://sdmntprwestus.oaiusercontent.com/files/00000000-5128-8230-9c33-173b6af0b862/raw?se=2026-09-29T02%3A16%3A04Z&sp=r&sv=2026-02-06&sr=b&scid=8a620a69-000e-5da5-9dfc-d0838338da33&skoid=864daabb-d06a-46b3-a747-d35075313a83&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T22%3A42%3A40Z&ske=2026-09-29T22%3A42%3A40Z&sks=b&skv=2026-02-06&sig=beGhTWnGyxySGEiREe616qEaTTOGeLGk0bnp4cvzjY0%3D' -o /tmp/aive_work/10_concentric_rings_twilight.png
          sha256sum /tmp/aive_work/music.wav
      - name: Render camera and differential-image pass
        run: python projects/shifting-cycles-recursive-horizon/run_music_revamp.py
      - name: Verify result
        run: |
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height,r_frame_rate -of json /tmp/aive_work/out/Shifting_Cycles_Recursive_Horizon_MUSIC_REVAMP_CAMERA_PASS_v1.mp4
          sha256sum /tmp/aive_work/out/Shifting_Cycles_Recursive_Horizon_MUSIC_REVAMP_CAMERA_PASS_v1.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: shifting-cycles-music-revamp-camera-pass
          path: |
            /tmp/aive_work/out/Shifting_Cycles_Recursive_Horizon_MUSIC_REVAMP_CAMERA_PASS_v1.mp4
            /tmp/aive_work/out/CAMERA_PASS_PLAN.json
            projects/shifting-cycles-recursive-horizon/BEATGRID_MUSIC_REVAMP.json
          retention-days: 5
