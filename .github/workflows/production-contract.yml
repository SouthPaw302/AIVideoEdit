name: AIVideoEdit Production Contract

on:
  pull_request:
  workflow_dispatch:

jobs:
  production-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Resolve contract branch
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" && "$GITHUB_HEAD_REF" == song/* && "$GITHUB_BASE_REF" == "main" ]]; then
            echo "FAIL: song branches are production archives and must not merge into main."
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" && "$GITHUB_BASE_REF" == "main" ]]; then
            CONTRACT_BRANCH="main"
          else
            CONTRACT_BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          fi
          echo "CONTRACT_BRANCH=$CONTRACT_BRANCH" >> "$GITHUB_ENV"
      - name: Bootstrap exact current-main AIVideoEdit OS
        shell: bash
        run: |
          python bootstrap.py boot --repo-root "$GITHUB_WORKSPACE" --branch "$CONTRACT_BRANCH"
      - name: Validate candidate main system
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        shell: bash
        run: |
          python general/reusable/tools/production_guard.py --bootstrap-phase --branch main
          python general/reusable/tools/narrative_guard.py --branch main
      - name: Verify bootstrapped production contract
        shell: bash
        run: |
          python .aivideoedit/os/general/reusable/tools/production_guard.py --branch "$CONTRACT_BRANCH"
          if [[ -f .aivideoedit/os/general/reusable/tools/narrative_guard.py ]]; then
            python .aivideoedit/os/general/reusable/tools/narrative_guard.py --branch "$CONTRACT_BRANCH"
          elif [[ "$GITHUB_EVENT_NAME" == "pull_request" && "$GITHUB_BASE_REF" == "main" ]]; then
            echo "Narrative guard is new in this candidate main and was validated in the candidate-main step."
          else
            echo "FAIL: bootstrapped current-main OS is missing narrative_guard.py"
            exit 1
          fi
