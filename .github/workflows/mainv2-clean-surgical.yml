name: MainV2 Clean Surgical Verification

on:
  push:
    branches:
      - MainV2-clean
  workflow_dispatch:

permissions:
  contents: read

jobs:
  step1-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install pytest numpy onnxruntime
      - name: Compile bootstrap
        run: python -m py_compile bootstrap.py
      - name: Run hardened boot unit tests
        run: python -m pytest -q tests/test_bootstrap_capsule.py
      - name: Run Runtime Gatekeeper unit tests
        run: python -m pytest -q tests/test_runtime_gatekeeper.py
      - name: Run Model Registry unit tests
        run: python -m pytest -q tests/test_model_registry.py
      - name: Run music worker fallback unit tests
        run: python -m pytest -q tests/test_music_beat_worker.py
      - name: Provision pinned Beat This ONNX model
        run: python general/reusable/tools/model_provision.py music-beat-onnx-v1
      - name: Run real CPU ONNX checkpoint
        shell: bash
        run: |
          python - <<'PY'
          import json, math, struct, wave
          from pathlib import Path
          from general.reusable.tools.music_beat_worker import analyze_music

          path=Path("beat_fixture_120.wav")
          sr=22050; bpm=120.0; duration=12.0
          total=int(duration*sr); samples=[0.0]*total
          beat_interval=int(sr*60.0/bpm)
          eighth=int(beat_interval/2)
          for start in range(0,total,eighth):
              strong=(start % beat_interval)==0
              freq=85 if strong else 220
              amp=0.9 if strong else 0.35
              pulse=int(sr*(0.055 if strong else 0.025))
              for i in range(pulse):
                  idx=start+i
                  if idx>=total: break
                  env=(1.0-i/pulse)**2
                  samples[idx]+=amp*env*math.sin(2*math.pi*freq*i/sr)
          with wave.open(str(path),"wb") as wf2:
              wf2.setnchannels(1); wf2.setsampwidth(2); wf2.setframerate(sr)
              wf2.writeframes(b"".join(struct.pack("<h",max(-32767,min(32767,int(x*32767)))) for x in samples))

          evidence=analyze_music(path)
          print(json.dumps(evidence,indent=2,sort_keys=True))
          assert evidence["engine"]=="beat_this_onnx", evidence
          assert evidence["providers"][0]=="CPUExecutionProvider", evidence
          assert len(evidence["beat_positions_seconds"]) >= 4, evidence
          assert evidence["authority"]=="evidence_only"
          PY
