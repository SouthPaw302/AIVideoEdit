name: IronFlame Song FX Gate
on:
  push:
    branches: ["song/ironflame-cleanroom-20260917"]
    paths:
      - "projects/ironflame-cleanroom/FX_REQUIREMENTS.fx.json"
      - "projects/ironflame-cleanroom/production/FX_PLAN.json"
      - "projects/ironflame-cleanroom/production/DEPTH_LOOP_SOURCE.json"
      - "projects/ironflame-cleanroom/production/render_fx_pass.py"
      - ".github/workflows/ironflame-fx-gate.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  song-fx-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --upgrade pip numpy opencv-python-headless
      - run: python -m py_compile projects/ironflame-cleanroom/production/render_fx_pass.py
      - run: python general/reusable/fx_v2/precompile_gate.py --manifest projects/ironflame-cleanroom/FX_REQUIREMENTS.fx.json --lock-out projects/ironflame-cleanroom/fx.lock.json
      - run: python general/reusable/fx_v2/precompile_gate.py --manifest projects/ironflame-cleanroom/FX_REQUIREMENTS.fx.json --verify-lock projects/ironflame-cleanroom/fx.lock.json
      - name: Mark verified state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("projects/ironflame-cleanroom/PROJECT_STATE.json");d=json.loads(p.read_text())
          d["fx_lock_verified"]=True
          if d.get("shot_proofs_accepted") and d.get("mode_aware_proofs_accepted"): d["stage"]="FX_LOCKED"
          p.write_text(json.dumps(d,indent=2)+"\n")
          PY
      - name: Persist lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/ironflame-cleanroom/fx.lock.json projects/ironflame-cleanroom/PROJECT_STATE.json
          git commit -m "chore(ironflame): record verified depth-aware FX lock" || exit 0
          git push origin HEAD:song/ironflame-cleanroom-20260917
