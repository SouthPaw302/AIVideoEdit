name: MainV2 Full Song Checkpoint

on:
  push:
    branches:
      - "checkpoint/pre-dawn-mainv2"
    paths:
      - "checkpoint_inputs/pre-dawn/**"
      - ".github/workflows/mainv2-pre-dawn-checkpoint.yml"
      - "runtime_v2/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AIVIDEOEDIT_REPO_ROOT: ${{ github.workspace }}
    steps:
      - name: Checkout checkpoint branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg and Runtime V2 dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -r runtime_v2/requirements-onnx.txt

      - name: Verify staged media
        shell: bash
        run: |
          set -euo pipefail
          test -s checkpoint_inputs/pre-dawn/avatar.jpg
          test -s checkpoint_inputs/pre-dawn/pre-dawn-full.m4a
          ffprobe -v error -show_entries format=duration,size -of json checkpoint_inputs/pre-dawn/pre-dawn-full.m4a
          ffprobe -v error -show_entries stream=width,height -of json checkpoint_inputs/pre-dawn/avatar.jpg

      - name: Run Runtime V2 micro-suite and real pinned ONNX checkpoint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p checkpoint_out
          python -m runtime_v2.verify --provision-model --require-onnx | tee checkpoint_out/runtime_v2_verify.json

      - name: Analyze the full uploaded song with Runtime V2
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from runtime_v2.models.music_beat import analyze_music

          src = Path("checkpoint_inputs/pre-dawn/pre-dawn-full.m4a")
          evidence = analyze_music(src)
          Path("checkpoint_out/music_analysis.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps({
              "engine": evidence.get("engine"),
              "bpm": evidence.get("bpm"),
              "beat_count": len(evidence.get("beat_positions_seconds") or []),
              "downbeat_count": len(evidence.get("downbeat_positions_seconds") or []),
              "resolved_model": (evidence.get("model_resolution") or {}).get("resolved"),
          }, indent=2))
          assert evidence.get("engine") == "beat_this_onnx", evidence
          assert len(evidence.get("beat_positions_seconds") or []) >= 4, evidence
          PY

      - name: Render full-song proof from canonical image
        shell: bash
        run: |
          set -euo pipefail
          AUDIO="checkpoint_inputs/pre-dawn/pre-dawn-full.m4a"
          IMAGE="checkpoint_inputs/pre-dawn/avatar.jpg"
          OUT="checkpoint_out/pre-dawn-mainv2-proof.mp4"
          DURATION="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$AUDIO")"

          ffmpeg -y -hide_banner -loglevel error \
            -loop 1 -framerate 30 -i "$IMAGE" \
            -i "$AUDIO" \
            -filter_complex "[0:v]scale=1600:1600:force_original_aspect_ratio=increase,crop=1600:900,zoompan=z='min(zoom+0.00003,1.075)':x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':d=1:s=1280x720:fps=30,eq=contrast=1.04:saturation=0.92[v]" \
            -map "[v]" -map 1:a:0 \
            -t "$DURATION" \
            -c:v libx264 -preset medium -crf 20 -pix_fmt yuv420p \
            -c:a aac -b:a 192k \
            -movflags +faststart \
            "$OUT"

      - name: Technical QC
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          from pathlib import Path

          audio = "checkpoint_inputs/pre-dawn/pre-dawn-full.m4a"
          video = "checkpoint_out/pre-dawn-mainv2-proof.mp4"

          def probe(path):
              raw = subprocess.check_output([
                  "ffprobe","-v","error","-show_streams","-show_format","-of","json",path
              ], text=True)
              return json.loads(raw)

          a = probe(audio)
          v = probe(video)
          ad = float(a["format"]["duration"])
          vd = float(v["format"]["duration"])
          streams = v["streams"]
          video_stream = next(s for s in streams if s.get("codec_type") == "video")
          audio_stream = next(s for s in streams if s.get("codec_type") == "audio")
          qc = {
              "schema": "aivideoedit.mainv2-checkpoint-qc.v1",
              "input_duration_seconds": ad,
              "output_duration_seconds": vd,
              "duration_delta_seconds": abs(ad-vd),
              "video_codec": video_stream.get("codec_name"),
              "audio_codec": audio_stream.get("codec_name"),
              "width": video_stream.get("width"),
              "height": video_stream.get("height"),
              "pass": (
                  abs(ad-vd) < 1.0
                  and video_stream.get("codec_name") == "h264"
                  and audio_stream.get("codec_name") == "aac"
                  and video_stream.get("width") == 1280
                  and video_stream.get("height") == 720
              ),
          }
          Path("checkpoint_out/qc.json").write_text(
              json.dumps(qc, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(json.dumps(qc, indent=2))
          assert qc["pass"], qc
          PY

      - name: Write checkpoint summary
        if: always()
        shell: bash
        run: |
          {
            echo "## MainV2 Pre-dawn full-song checkpoint"
            echo
            echo "- Branch: \`${GITHUB_REF_NAME}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Full song input: 84.36s"
            echo "- Canonical visual: uploaded rider image"
            echo "- Runtime V2 verifier + pinned ONNX checkpoint executed"
            echo "- Full-length proof render: checkpoint_out/pre-dawn-mainv2-proof.mp4"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload proof artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pre-dawn-mainv2-full-checkpoint
          path: checkpoint_out/
          if-no-files-found: warn
          retention-days: 3
          compression-level: 6
