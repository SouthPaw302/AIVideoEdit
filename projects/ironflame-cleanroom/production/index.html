<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>IronFlame Clean-room — Molten Cartography</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030407}
body{position:relative;width:1920px;height:1080px;font-family:system-ui,sans-serif}
.clip{position:absolute;inset:0;overflow:hidden}
.scene{background:#030407}
canvas{display:block;width:1920px;height:1080px}
#audio-master{display:none}
</style>
</head>
<body data-composition-id="ironflame-cleanroom" data-width="1920" data-height="1080" data-duration="244.68" data-fps="24">
<audio id="audio-master" data-start="0" data-duration="244.68" data-track-index="20" src="./assets/ironflame.wav"></audio>
<div id="scene-01" class="clip scene" data-start="0" data-duration="31" data-track-index="0"><canvas width="1920" height="1080"></canvas></div>
<div id="scene-02" class="clip scene" data-start="31" data-duration="15" data-track-index="0"><canvas width="1920" height="1080"></canvas></div>
<div id="scene-03" class="clip scene" data-start="46" data-duration="21" data-track-index="0"><canvas width="1920" height="1080"></canvas></div>
<div id="scene-04" class="clip scene" data-start="67" data-duration="12" data-track-index="0"><canvas width="1920" height="1080"></canvas></div>
<div id="scene-05" class="clip scene" data-start="79" data-duration="86" data-track-index="0"><canvas width="1920" height="1080"></canvas></div>
<div id="scene-06" class="clip scene" data-start="165" data-duration="12" data-track-index="0"><canvas width="1920" height="1080"></canvas></div>
<div id="scene-07" class="clip scene" data-start="177" data-duration="11" data-track-index="0"><canvas width="1920" height="1080"></canvas></div>
<div id="scene-08" class="clip scene" data-start="188" data-duration="22" data-track-index="0"><canvas width="1920" height="1080"></canvas></div>
<div id="scene-09" class="clip scene" data-start="210" data-duration="23" data-track-index="0"><canvas width="1920" height="1080"></canvas></div>
<div id="scene-10" class="clip scene" data-start="233" data-duration="11.68" data-track-index="0"><canvas width="1920" height="1080"></canvas></div>
<script src="./control-map.js"></script>
<script src="./vendor/aivideoedit-gsap.min.js"></script>
<script>
(() => {
  'use strict';
  const W=1920,H=1080,D=244.68;
  const starts=[0,31,46,67,79,165,177,188,210,233];
  const ends=[31,46,67,79,165,177,188,210,233,244.68];
  const CM=window.AIVIDEOEDIT_CONTROL_MAP;
  if(!CM || CM.schema!=='aivideoedit.browser-control-map.v1') throw new Error('missing canonical AIVideoEdit browser control map');
  const major=(CM.key_moments||[]).map(x=>[Number(x.t),Number(x.delta),1]);
  const rolls=(CM.rolls||[]).map(x=>[Number(x.start),Number(x.end),Number(x.hits||0)]);
  const energyBuckets=CM.energy||[];
  const scenes=[...document.querySelectorAll('.scene')];
  const canvases=scenes.map(s=>s.querySelector('canvas'));
  const contexts=canvases.map(c=>c.getContext('2d',{alpha:false}));
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const smooth=(x)=>x*x*(3-2*x);
  const pulse=(t,c,w)=>Math.exp(-Math.pow((t-c)/w,2));
  function eventField(t){
    let v=0;
    for(const [c,d] of major) v += d*pulse(t,c,1.7);
    return v;
  }
  function energyAt(t){
    if(!energyBuckets.length) return clamp(0.35+0.45*Math.abs(eventField(t)),0,1);
    const idx=clamp(Math.floor(t),0,energyBuckets.length-1);
    const a=energyBuckets[idx];
    const b=energyBuckets[Math.min(idx+1,energyBuckets.length-1)];
    const f=clamp(t-Number(a.start||idx),0,1);
    return clamp(Number(a.energy)*(1-f)+Number(b.energy)*f,0,1);
  }
  function rollField(t){
    let v=0;
    for(const [a,b,hits] of rolls){
      if(t<a-0.25 || t>b+0.25) continue;
      const center=(a+b)*0.5;
      const width=Math.max(0.2,(b-a)*0.65);
      v+=Math.min(1,hits/12)*Math.exp(-Math.pow((t-center)/width,2));
    }
    return clamp(v,0,1);
  }
  function sectionFor(t){
    for(let i=0;i<ends.length;i++) if(t<ends[i]||i===ends.length-1) return i;
    return ends.length-1;
  }
  function draw(i,t){
    const ctx=contexts[i]; if(!ctx) return;
    const st=starts[i],en=ends[i],span=en-st,local=clamp((t-st)/span,0,1);
    const e=energyAt(t),ev=eventField(t);
    ctx.fillStyle='#030407'; ctx.fillRect(0,0,W,H);
    const terminal=i===9?smooth(clamp((t-233)/(D-233),0,1)):0;
    const layerKeep=1-terminal;
    const g=ctx.createRadialGradient(W*0.52,H*0.48,10,W*0.52,H*0.48,W*0.72);
    const cyan=Math.round(9+22*e*layerKeep);
    const violet=Math.round(10+16*Math.max(0,ev)*layerKeep);
    g.addColorStop(0,`rgb(${7+violet},${12+cyan},${18+cyan})`);
    g.addColorStop(0.58,'rgb(5,7,11)');
    g.addColorStop(1,'rgb(3,4,7)');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    const layerCount=Math.max(1,Math.round((7+i*0.75+e*7)*layerKeep));
    const cx=W*(0.5+0.018*Math.sin(t*0.053));
    const cy=H*(0.5+0.022*Math.cos(t*0.047));
    const faultX=cx + Math.sin(t*0.11+i)*W*0.055;
    const compression=(i===3?0.55+0.45*Math.abs(local-0.5)*2:1);
    const depthSep=(i===4?1.22:1)*(0.9+0.18*e);
    for(let layer=0;layer<layerCount;layer++){
      const depth=(layer+1)/(layerCount+1);
      const alpha=(0.12+0.50*(1-depth))*layerKeep;
      const silver=170+Math.round(70*(1-depth));
      ctx.strokeStyle=`rgba(${silver},${silver+3},${Math.min(255,silver+12)},${alpha})`;
      ctx.lineWidth=0.7+2.2*(1-depth);
      ctx.beginPath();
      const lines=8+Math.floor(7*(1-depth));
      for(let band=0;band<lines;band++){
        const baseY=H*(0.12+0.76*(band/(Math.max(1,lines-1))));
        const phase=t*(0.018+depth*0.011)+layer*0.77+band*0.43;
        for(let x=0;x<=W;x+=18){
          const nx=(x-cx)/W;
          const fault=Math.exp(-Math.pow((x-faultX)/(W*(0.055+depth*0.025)),2));
          const wave1=Math.sin(nx*16+phase)*H*(0.018+0.032*e)*(1-depth*0.45);
          const wave2=Math.sin(nx*37-phase*0.63+band)*H*(0.006+0.010*Math.abs(ev));
          const lens=fault*H*ev*(0.12+0.08*(1-depth));
          const drift=Math.sin(t*0.031+layer)*H*0.013*depthSep;
          const y=cy+(baseY-H*0.5)*compression+wave1+wave2+lens+drift;
          if(x===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
        }
      }
      ctx.stroke();
    }
    if(layerKeep>0.08){
      const seamAlpha=clamp((0.25+0.45*e+0.8*Math.max(0,ev))*layerKeep,0,0.9);
      ctx.strokeStyle=`rgba(210,235,246,${seamAlpha})`;
      ctx.lineWidth=1.2+3.0*e;
      ctx.beginPath();
      for(let y=0;y<=H;y+=14){
        const jitter=Math.sin(y*0.021+t*0.19)*W*(0.004+0.012*e);
        const bend=Math.sin(y*0.006-t*0.051)*W*0.018;
        const x=faultX+jitter+bend;
        if(y===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
      }
      ctx.stroke();
    }
    if(i>=4 && i<=8 && layerKeep>0.15){
      ctx.save();
      ctx.globalCompositeOperation='screen';
      const roll=rollField(t);
      const spacing=32+10*Math.sin(t*0.13)-9*roll;
      ctx.strokeStyle=`rgba(68,164,194,${0.035+0.075*e+0.09*roll})`;
      ctx.lineWidth=1;
      for(let k=-H;k<W+H;k+=spacing){
        ctx.beginPath();
        ctx.moveTo(k+Math.sin(t*0.17)*24,0);
        ctx.lineTo(k-H+Math.cos(t*0.11)*24,H);
        ctx.stroke();
      }
      ctx.restore();
    }
    for(const [et,delta] of major){
      const p=pulse(t,et,0.16)*Math.min(1,Math.abs(delta)*2.6)*layerKeep;
      if(p<0.02)continue;
      const gx=W*(0.18+0.64*((et*0.61803398875)%1));
      const gy=H*(0.2+0.6*((et*0.41421356237)%1));
      const rg=ctx.createRadialGradient(gx,gy,0,gx,gy,140);
      rg.addColorStop(0,`rgba(205,240,255,${0.44*p})`);
      rg.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=rg; ctx.fillRect(gx-150,gy-150,300,300);
    }
    if(i===9){
      ctx.fillStyle=`rgba(3,4,7,${smooth(clamp((terminal-0.65)/0.35,0,1))})`;
      ctx.fillRect(0,0,W,H);
    }
  }
  function drawTime(t){ draw(sectionFor(t),t); }
  const clock={t:0};
  const tl=gsap.timeline({paused:true});
  tl.to(clock,{t:D,duration:D,ease:'none',onUpdate:()=>drawTime(clock.t)},0);
  window.__timelines=window.__timelines||{};
  window.__timelines['ironflame-cleanroom']=tl;
  drawTime(0);
})();
</script>
</body>
</html>
