services:
  bridge:
    build:
      context: .
      dockerfile: runtime_v2/Dockerfile
    environment:
      BRIDGE_TOKEN: ${BRIDGE_TOKEN:?Set BRIDGE_TOKEN}
      AIVIDEOEDIT_STUDIO_URL: http://studio:8080
      AIVIDEOEDIT_STUDIO_TIMEOUT_SECONDS: "120"
      AIVIDEOEDIT_REPO_ROOT: /app
      AIVIDEOEDIT_HARNESS_ENABLED: ${AIVIDEOEDIT_HARNESS_ENABLED:-0}
      AIVIDEOEDIT_HARNESS_PROFILE: ${AIVIDEOEDIT_HARNESS_PROFILE:-headless}
      AIVIDEOEDIT_ATTESTATION_KEY: ${AIVIDEOEDIT_ATTESTATION_KEY:?Set AIVIDEOEDIT_ATTESTATION_KEY}
      AIVIDEOEDIT_REQUIRE_SIGNED_ATTESTATION: "1"
    ports:
      - "${BRIDGE_PORT:-8787}:8787"
    volumes:
      - runtime_jobs:/state/jobs
      - model_cache:/app/.aivideoedit/models
    depends_on:
      studio:
        condition: service_started
    restart: unless-stopped

  studio:
    build:
      context: .
      dockerfile: runtime_v2/Dockerfile
    command: ["python", "prototype/backend_gui/stack.py"]
    environment:
      AIVE_HOST: 0.0.0.0
      AIVE_PORT: "8080"
      AIVE_RUNTIME: /state/studio
      AIVE_AUTHORITY_REF: ${AIVE_AUTHORITY_REF:-MainV2}
      AIVIDEOEDIT_ATTESTATION_KEY: ${AIVIDEOEDIT_ATTESTATION_KEY:?Set AIVIDEOEDIT_ATTESTATION_KEY}
      AIVIDEOEDIT_REQUIRE_SIGNED_ATTESTATION: "1"
    expose:
      - "8080"
    volumes:
      - studio_state:/state/studio
      - model_cache:/app/.aivideoedit/models
    restart: unless-stopped

volumes:
  runtime_jobs:
  studio_state:
  model_cache:
